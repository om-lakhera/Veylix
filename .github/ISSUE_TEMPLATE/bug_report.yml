name: Bug report
description: Report a reproducible Veylix behavior issue.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private manifests, private repository URLs, or personal information.
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include redacted error text and the affected feature.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Veylix version or commit
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic or public data only.
    validations:
      required: true

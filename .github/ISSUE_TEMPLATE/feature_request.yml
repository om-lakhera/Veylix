name: Feature request
description: Suggest a Veylix capability or workflow improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private manifests, or private repository URLs.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: Data sources, constraints, or limitations
    validations:
      required: false
